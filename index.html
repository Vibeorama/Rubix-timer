<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cube Timer">
  <title>Cube Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="stats">
      <div class="stat"><span class="label">Best</span><span class="value" id="stat-best">–</span></div>
      <div class="stat"><span class="label">Ao5</span><span class="value" id="stat-ao5">–</span></div>
      <div class="stat"><span class="label">Ao12</span><span class="value" id="stat-ao12">–</span></div>
      <div class="stat"><span class="label">Solves</span><span class="value" id="stat-count">0</span></div>
    </div>
    <p class="scramble" id="scramble"></p>
  </header>

  <main class="pad" id="pad" data-state="idle">
    <div class="time" id="time">0.00</div>
    <div class="hint" id="hint">Hold, release to start</div>
  </main>

  <footer class="bottom">
    <button class="btn" id="btn-history" type="button">History</button>
    <button class="btn" id="btn-new-scramble" type="button">New scramble</button>
    <div class="version" id="version"></div>
  </footer>

  <section class="sheet" id="history" hidden>
    <div class="sheet-head">
      <h2>History</h2>
      <button class="btn" id="btn-close-history" type="button">Close</button>
    </div>
    <ol class="solves" id="solve-list"></ol>
    <button class="btn danger" id="btn-clear" type="button">Clear all</button>
  </section>

  <script src="js/version.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
